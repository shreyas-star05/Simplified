name: Build and test

on:
  push:
    branches: [ main, 'r*' ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4

      - name: Unit tests and release APK
        run: |
          chmod +x gradlew
          mkdir -p ci-out
          set -o pipefail
          ./gradlew :core:test :app:assembleRelease --no-daemon --stacktrace 2>&1 | tee ci-out/build-log.txt

      - name: Name the APK
        run: cp app/build/outputs/apk/release/app-release.apk DuskLab.apk

      - uses: actions/upload-artifact@v4
        with:
          name: DuskLab-apk
          path: DuskLab.apk

      - name: Publish build output to the ci-results-build branch
        if: always()
        run: |
          find core/build/test-results -name '*.xml' -exec cp {} ci-out/ \; 2>/dev/null || true
          cd ci-out
          echo "run ${{ github.run_number }}, commit ${{ github.sha }}, job status ${{ job.status }}" > RUN.txt
          git init -q -b ci-results-build
          git config user.name "github-actions"
          git config user.email "actions@github.com"
          git add -A
          git commit -qm "Build output for ${{ github.sha }}"
          git push -f "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git" ci-results-build

      - name: Publish as a release (easy phone download)
        if: github.ref == 'refs/heads/main'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: lab-${{ github.run_number }}
          name: Dusk Lab build ${{ github.run_number }}
          body: Release 0, the throwaway test build. Download DuskLab.apk below and open it on your phone to install or update.
          files: DuskLab.apk

  emulator:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4

      - name: Enable KVM for the emulator
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Tap-through, screenshots and restart test on an emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          target: google_apis
          arch: x86_64
          profile: pixel_6
          disable-animations: true
          emulator-options: -no-snapshot-save -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim
          script: bash ci/emulator-tests.sh

      - name: Publish emulator output to the ci-results-emulator branch
        if: always()
        run: |
          mkdir -p ci-out
          cd ci-out
          echo "run ${{ github.run_number }}, commit ${{ github.sha }}, job status ${{ job.status }}" > RUN.txt
          git init -q -b ci-results-emulator
          git config user.name "github-actions"
          git config user.email "actions@github.com"
          git add -A
          git commit -qm "Emulator output for ${{ github.sha }}"
          git push -f "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git" ci-results-emulator
