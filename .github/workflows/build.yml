name: Build and test

on:
  push:
    branches: [ main, 'r*' ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4

      - name: Signing key (only if the secret has been added)
        env:
          KEY_B64: ${{ secrets.DUSK_KEYSTORE_B64 }}
        run: |
          if [ -n "$KEY_B64" ]; then
            echo "$KEY_B64" | base64 -d > "$RUNNER_TEMP/dusk.jks"
            echo "DUSK_KEYSTORE_FILE=$RUNNER_TEMP/dusk.jks" >> "$GITHUB_ENV"
            echo "Signing with the real Dusk key."
          else
            echo "No signing secret yet: building the preview app."
          fi

      - name: Unit tests and release APKs
        env:
          DUSK_KEYSTORE_PASSWORD: ${{ secrets.DUSK_KEYSTORE_PASSWORD }}
        run: |
          chmod +x gradlew
          mkdir -p ci-out
          set -o pipefail
          ./gradlew :core:test :app:assembleRelease :lab:assembleRelease --no-daemon --stacktrace 2>&1 | tee ci-out/build-log.txt

      - name: Name the APKs
        run: |
          if [ -n "${DUSK_KEYSTORE_FILE:-}" ]; then
            cp app/build/outputs/apk/release/app-release.apk Dusk.apk
          else
            cp app/build/outputs/apk/release/app-release.apk DuskPreview.apk
          fi
          cp lab/build/outputs/apk/release/lab-release.apk DuskLab.apk
          ls -la *.apk

      - uses: actions/upload-artifact@v4
        with:
          name: apks
          path: '*.apk'

      - name: Publish build output to the ci-results-build branch
        if: always()
        run: |
          find core/build/test-results -name '*.xml' -exec cp {} ci-out/ \; 2>/dev/null || true
          cd ci-out
          echo "run ${{ github.run_number }}, commit ${{ github.sha }}, job status ${{ job.status }}" > RUN.txt
          git init -q -b ci-results-build
          git config user.name "github-actions"
          git config user.email "actions@github.com"
          git add -A
          git commit -qm "Build output for ${{ github.sha }}"
          git push -f "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git" ci-results-build

      - name: Publish as a release (easy phone download)
        if: github.ref == 'refs/heads/main'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          name: Dusk build ${{ github.run_number }}
          body: |
            Download on your phone and open the file to install or update.
            - Dusk.apk or DuskPreview.apk: the app. "Preview" means the signing key has not been added yet; it installs as a separate app called "Dusk preview".
            - DuskLab.apk: the release 0 test build, for the speech, reminder and plan tests.
          files: '*.apk'

  emulator-app:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
      - name: Enable KVM for the emulator
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Dusk tap-through, restore drill and PIN drill on an emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          target: google_apis
          arch: x86_64
          profile: pixel_6
          disable-animations: true
          emulator-options: -no-snapshot-save -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim
          script: bash ci/app-emulator-tests.sh
      - name: Publish emulator output to the ci-results-app branch
        if: always()
        run: |
          mkdir -p ci-out
          cd ci-out
          echo "run ${{ github.run_number }}, commit ${{ github.sha }}, job status ${{ job.status }}" > RUN.txt
          git init -q -b ci-results-app
          git config user.name "github-actions"
          git config user.email "actions@github.com"
          git add -A
          git commit -qm "App emulator output for ${{ github.sha }}"
          git push -f "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git" ci-results-app

  emulator-lab:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
      - name: Enable KVM for the emulator
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Test build tap-through and restart test on an emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          target: google_apis
          arch: x86_64
          profile: pixel_6
          disable-animations: true
          emulator-options: -no-snapshot-save -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim
          script: bash ci/emulator-tests.sh
      - name: Publish emulator output to the ci-results-emulator branch
        if: always()
        run: |
          mkdir -p ci-out
          cd ci-out
          echo "run ${{ github.run_number }}, commit ${{ github.sha }}, job status ${{ job.status }}" > RUN.txt
          git init -q -b ci-results-emulator
          git config user.name "github-actions"
          git config user.email "actions@github.com"
          git add -A
          git commit -qm "Emulator output for ${{ github.sha }}"
          git push -f "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git" ci-results-emulator
